name: Build app (APK + web)

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/build-app.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The repo only keeps lib/ and pubspec.yaml; platform folders are generated here.
      - name: Generate platform folders
        run: flutter create --project-name tmanvibez_ai --org com.tmanvibez --platforms=android,ios,web .

      - name: Keep our own source files (flutter create must not replace them)
        working-directory: .
        run: |
          git checkout -- app/lib app/pubspec.yaml
          rm -rf app/test

      - name: Android setup (internet permission + app name)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="TmanVibez AI"#' android/app/src/main/AndroidManifest.xml

      # Some plugins are compiled against an older Android SDK than their own dependencies need.
      # Force every Android module to compile against SDK 36.
      - name: Gradle init script (compileSdk 36 everywhere)
        working-directory: .
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/compile-sdk.gradle <<'EOF'
          allprojects { p ->
            p.afterEvaluate {
              if (p.extensions.findByName('android') != null) {
                p.android.compileSdkVersion 36
                // the lint tool crashes inside some plugins; release APKs don't need it
                p.android.lint {
                  checkReleaseBuilds = false
                  abortOnError = false
                }
              }
            }
          }
          EOF

      - run: flutter pub get

      - name: Build web
        run: flutter build web --release

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tmanvibez-ai-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tmanvibez-ai-web
          path: app/build/web
